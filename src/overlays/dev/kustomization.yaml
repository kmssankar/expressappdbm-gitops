apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Reference the base k8s folder from your app source repository
resources:
  - github.com/kmssankar/expressappdbm/k8s?ref=main # or a specific tag/branch

# Kargo will modify the newTag fields in this block
images:
  - name: ghcr.io/kmssankar/expressappdbm
    newTag: latest
  - name: ghcr.io/kmssankar/flyway-migrations
    newTag: latest
